# Three-pane layout: left side split vertically (2 panes), right side (1 pane)
# All windows start in the directory where kitty was launched from
# Split ratios: ~71% left / 29% right, ~84% top-left / 16% bottom-left

# Set the layout to splits
layout splits

# Create first window (top-left) with nvim
launch nvim

# Create second window to the right (Claude) - splits from window 1 immediately
launch --location=vsplit claude --model haiku

# Focus back to window 1, then create third window below it (bottom-left)
focus --match "num:1"
launch --location=hsplit

# Focus the right pane (where Claude typically runs)
focus --match "num:2"
