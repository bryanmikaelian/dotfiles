# Three-pane layout: left side split vertically (2 panes), right side (1 pane)
# All windows start in the directory where kitty was launched from
# Split ratios: ~71% left / 29% right, ~84% top-left / 16% bottom-left

# Set the layout to splits
layout splits

# Create first window (top-left)
launch

# Create second window below the first (bottom-left)
launch --location=hsplit

# Focus back to the first window, then create third window to the right with Claude
focus-window --match "num:1"
launch --location=vsplit claude --model haiku

# Adjust the split ratios to match the preferred layout
# Make the left side about 71% of the width
focus-window --match "num:1"
resize-window wider 50
resize-window wider 50

# Adjust the vertical split on the left side (top should be ~84% height)
focus-window --match "num:2"
resize-window shorter 20

# Focus the right pane (where Claude typically runs)
focus-window --match "num:3"
